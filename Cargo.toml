[package]
name = "pixelinator"
version = "0.1.0"
edition = "2021"
authors = ["myavuzuzun"]
license = "MIT"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
